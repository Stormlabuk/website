# ── Site settings ────────────────────────────────────────────────────────────
title: "STORM Lab UK"
tagline: "Science and Technology Of Robotics in Medicine"
description: >-
  STORM Lab at the University of Leeds pioneers miniature surgical robots,
  capsule endoscopes and AI-guided tools for minimally invasive medicine —
  led by Professor Pietro Valdastri.
# Set `url` to your published address (e.g. https://stormlabuk.github.io or a custom domain).
url: ""
# If the site is served from a project subpath (https://USER.github.io/REPO),
# set baseurl to "/REPO". For a custom domain or user/org page, leave it "".
baseurl: ""
lang: en-GB

# ── Branding / contact ───────────────────────────────────────────────────────
organisation: "University of Leeds"
director: "Professor Pietro Valdastri"
email: "stormlab@leeds.ac.uk"
address:
  - "School of Electronic & Electrical Engineering"
  - "University of Leeds, LS2 9JT"
  - "United Kingdom"

# Formspree (or similar) endpoint for the contact form. Leave blank to fall back
# to a mailto: submission. Create a free form at https://formspree.io and paste
# its endpoint here, e.g. https://formspree.io/f/abcdwxyz
contact_form_action: "https://formspree.io/f/mojorgny"

# ── Zotero (publications page) ───────────────────────────────────────────────
# The Publications page is generated from this library by scripts/fetch_zotero.rb.
# Run `make fetch` (locally) or the "Refresh publications" GitHub Action.
zotero:
  library_type: "group"   # "group" or "user"
  library_id: "5599357"   # zotero.org/groups/5599357/stormlab
  latest_count: 3         # newest items featured
  # One Zotero collection per page → written to _data/zotero/<slug>.yml.
  # `main` drives the Publications page; each research page reads the collection
  # named after its slug. Fill in the collection KEY from the Zotero URL
  # (…/collections/<KEY>/collection). Leave blank to skip a page.
  collections:
    main: "853N8SBR"                       # parent — Publications page
    magnetic-tentacles: "2JHCZZCZ"
    magnetic-flexible-endoscopy: "XQYZ8LQA"
    magnetic-vine-robots: "IDE3IXBF"
    mri-actuated-instruments: "9WUPBCJJ"
    magnetically-guided-ultrasound: "U3KD946C"
    autonomy-in-surgical-robotics: "WMUS7FW7"

# ── Build settings ───────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:path/
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope: { path: "", type: "research" }
    values: { layout: "research_detail", nav_section: "Research" }
  - scope: { path: "", type: "news" }
    values: { layout: "news_article", nav_section: "News" }
  - scope: { path: "" }
    values: { layout: "default" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts
  - node_modules
  - bin
  - Makefile
  - "*.cmd"
