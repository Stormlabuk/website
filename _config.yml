# ── Site settings ────────────────────────────────────────────────────────────
title: "STORM Lab UK"
tagline: "Science and Technology Of Robotics in Medicine"
description: >-
  STORM Lab at the University of Leeds pioneers miniature surgical robots,
  capsule endoscopes and AI-guided tools for minimally invasive medicine —
  led by Professor Pietro Valdastri.
# Set `url` to your published address (e.g. https://stormlabuk.github.io or a custom domain).
url: ""
# If the site is served from a project subpath (https://USER.github.io/REPO),
# set baseurl to "/REPO". For a custom domain or user/org page, leave it "".
baseurl: ""
lang: en-GB

# ── Branding / contact ───────────────────────────────────────────────────────
organisation: "University of Leeds"
director: "Professor Pietro Valdastri"
email: "stormlab@leeds.ac.uk"
address:
  - "School of Electronic & Electrical Engineering"
  - "University of Leeds, LS2 9JT"
  - "United Kingdom"

# Formspree (or similar) endpoint for the contact form. Leave blank to fall back
# to a mailto: submission. Create a free form at https://formspree.io and paste
# its endpoint here, e.g. https://formspree.io/f/abcdwxyz
contact_form_action: ""

# ── Build settings ───────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:path/
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope: { path: "", type: "research" }
    values: { layout: "research_detail", nav_section: "Research" }
  - scope: { path: "", type: "news" }
    values: { layout: "news_article", nav_section: "News" }
  - scope: { path: "" }
    values: { layout: "default" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts
  - node_modules
  - bin
  - Makefile
