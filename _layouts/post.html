---
layout: default
---
<div class="page-head">
  <div class="container">
    <p class="pill">News</p>
    <h1>{{ page.title }}</h1>
  </div>
</div>

<div class="section">
  <div class="container">
    <article class="prose">
      <p class="post-meta">
        {{ page.date | date: "%-d %B %Y" }}{% if page.author %} · {{ page.author }}{% endif %}
      </p>
      {{ content }}
    </article>
    <p style="margin-top:var(--space-12)">
      <a class="btn btn--ghost" href="{{ '/news/' | relative_url }}">&larr; All news</a>
    </p>
  </div>
</div>
