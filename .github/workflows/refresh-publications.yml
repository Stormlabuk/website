# Regenerate _data/publications.yml from Zotero and commit it.
#
# Manual-only by default (Actions tab → Run workflow). Set the repository secret
# ZOTERO_API_KEY first if your library is private. To refresh on a schedule,
# uncomment the `schedule` block below.
name: Refresh publications from Zotero

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # every Monday 06:00 UTC

permissions:
  contents: write
  actions: write   # to dispatch the Pages deploy after committing

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Fetch from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: ruby scripts/fetch_zotero.rb
      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet -- _data/zotero; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/zotero
            git commit -m "Refresh publications from Zotero"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
          fi
      # A commit pushed with the Actions token does not itself trigger the Pages
      # workflow, so dispatch it explicitly when the data changed.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
