# ─────────────────────────────────────────────────────────────────────────
# Publishing is OFF by default.
#
# This workflow does NOT run on push — it only runs when you trigger it
# manually (Actions tab → "Build and deploy Jekyll to GitHub Pages" → Run
# workflow), and the deploy step additionally needs GitHub Pages enabled
# (Settings → Pages → Source: GitHub Actions), which requires a public repo or
# a GitHub plan that allows Pages on private repos.
#
# For day-to-day work, build/preview locally instead:
#     bundle install
#     ./bin/jekyll serve        # or: bundle exec jekyll serve
#     # → http://localhost:4000
#
# When you're ready to publish, change the `on:` block to:
#     on:
#       push:
#         branches: [main]
#       workflow_dispatch:
# and enable Pages in the repo settings.
# ─────────────────────────────────────────────────────────────────────────
name: Build and deploy Jekyll to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
