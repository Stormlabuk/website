# ─────────────────────────────────────────────────────────────────────────
# Builds the site with Jekyll and publishes to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
#
# Runs automatically on every push to the branch that serves the site, and can
# also be triggered manually from the Actions tab. For day-to-day work, preview
# locally instead: `bundle install` then `./bin/jekyll serve` (or
# `bundle exec jekyll serve`) → http://localhost:4000
# ─────────────────────────────────────────────────────────────────────────
name: Build and deploy Jekyll to GitHub Pages

on:
  push:
    branches:
      - main          # production: merging to main publishes to www.stormlabuk.com
  workflow_dispatch:   # manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      # Served at the custom-domain root (www.stormlabuk.com), so the build must
      # honour `baseurl: ""` from _config.yml. Do NOT pass --baseurl here:
      # actions/configure-pages emits base_path "/website" for a project site,
      # and that flag would override _config.yml, prefixing every relative_url
      # asset with /website → 404s on the custom domain.
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
