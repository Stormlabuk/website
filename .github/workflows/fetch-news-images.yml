# Download the news images from the old WordPress site and commit them.
#
# Manual-only (Actions tab → Run workflow). Reads scripts/news_images.tsv,
# downloads any images not already present under assets/images/news/, and
# commits them to the current branch. Runs on a GitHub-hosted runner, which can
# reach stormlabuk.com. Safe to re-run; only missing images are fetched.
name: Fetch news images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download images
        run: bash scripts/fetch_news_images.sh
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/images/news; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/images/news
            git commit -m "Fetch news images from WordPress export"
            git push
          else
            echo "No new images."
          fi
